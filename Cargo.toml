[workspace]
members = [
    "crates/packing-core",
    "crates/packing-cli",
    "crates/packing-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
